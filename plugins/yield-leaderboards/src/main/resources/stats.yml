# One entry per rankable stat. "field" is the dotted path into the shared
# "playerData" Mongo collection - every plugin's data lives under its own
# top-level key on one document (yield-packs' is "packs", and every
# satellite plugin - quests/skilltree/rebirth - reuses that same profile,
# so nearly everything lives under "packs.*"). "type" tells the leaderboard
# how to parse/compare/format the raw value:
#   BIGINT_STRING - currency fields (stored as strings for unbounded precision)
#   LONG / INT    - plain numeric counters
#
# Add a new stat here any time a new persisted field is worth ranking - no
# code changes needed. Run /admin leaderboards reload after editing.
stats:
  coins:
    field: "packs.coins"
    type: BIGINT_STRING
  diamonds:
    # Real BSON key stays "packs.gems" - PackPlayerProfile keeps @BsonProperty("gems")
    # on its renamed `diamonds` field so existing player balances aren't lost.
    field: "packs.gems"
    type: BIGINT_STRING
  rebirths:
    field: "packs.rebirths"
    type: INT
  prestiges:
    field: "packs.prestiges"
    type: INT
  prestige_points:
    field: "packs.prestigePoints"
    type: BIGINT_STRING
  cube_kills:
    field: "packs.lifetimeCubeKills"
    type: LONG
  coins_earned:
    field: "packs.lifetimeCoinsEarned"
    type: BIGINT_STRING
  boss_damage:
    field: "packs.lifetimeBossDamage"
    type: LONG
  best_luck:
    # The "1 in N" of the rarest single pack pull this player has ever landed
    # (see PackRollService#recordBestLuck) - the one board that ranks a moment
    # rather than an accumulation, so a brand-new account can top it.
    field: "packs.bestLuckOneIn"
    type: LONG
  halloween_candy_corn:
    # Candy Corn EARNED this Halloween (yield-events), not held - a balance
    # falls every time someone hatches or shops, which would rank the
    # players who spend least rather than the ones who played most.
    #
    # Keyed by SEASON ("halloween_2026"), because an event's id is reused
    # every year and its quest counters restart with each run (see
    # SeasonalEvent#seasonId). When next year's dates go into events.yml,
    # change the year here too - the board is this year's race, not an
    # all-time one.
    field: "events.questProgress.halloween_2026:CANDY_EARNED"
    type: LONG
