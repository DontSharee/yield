# Tools - held in hotbar slot 0, they make your TAPS hit harder.
#
# Every click on a cube is a tap (see yield-zones' TapService): 10% of your
# strongest equipped pet's hit. The tool you're HOLDING multiplies that by
# its tap-multiplier - put it away and your taps are back to bare hands. You
# always get your best owned tool; buying the next one swaps it in place.
#
# The path is LINEAR, in the order written here: each tool needs the one
# above it. /tools shows the whole path with Buy Next and Buy Max (buys as
# far down the path as your coins reach, in one click).
#
# PRICES are 500 "basic cubes" of the zone each tool is pinned to - that
# zone's most common cube's coin value x 500, roughly 5-10 minutes of its
# income - so every tool lands as you reach its zone however far the coin
# ladder climbs. Written out as plain coins so they're easy to tweak; if
# zones.yml's ladder moves, re-derive them the same way.
#
# BALANCE: tap DAMAGE scales freely with the tool, but taps can land a
# killing blow at most once a second (TapService#TAP_KILL_COOLDOWN_MILLIS),
# the same pace the pets kill at - so no tool can make clicking out-kill the
# pets; tools make taps hit hard and tough cubes fall faster. Measured
# against the pacing model, the top tool with Auto Tap is ~4% faster to the
# last zone. See BALANCE.md, "Tap damage".
#
# Fields:
#   display-name     & colour codes work
#   material         the item held - any Minecraft item
#   tap-multiplier   what it multiplies a tap by, while held
#   cost-coins       price to unlock (needs every tool above it first)
#   description      lore lines under the name, optional
#
# Adding a tool: add an entry where it belongs in the path. Reordering
# changes what each player owns (ownership is a position on this list), so
# prefer appending. Run /admin tools reload after editing.
