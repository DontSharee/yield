# Weapons - held in hotbar slot 0, they make your TAPS hit harder.
#
# Every click on a cube is a tap (see yield-zones' TapService). A tap deals
# a share of your PET POWER - your equipped pets' combined hit, after every
# damage boost. Bare-handed that share is 0.02x; holding a weapon it is the
# weapon's "power" instead. Put it away and you're back to bare hands. You
# always carry your best owned weapon; buying the next one swaps it in place.
#
# The path is LINEAR, in the order written here: each weapon needs the one
# above it. /tools shows the whole path, paginated - click the next weapon
# to buy it, or Buy Max to buy as far as your coins reach.
#
# 120 weapons: 6 per zone (Dagger, Hatchet, Pick, Scythe, Blade and that
# zone's signature piece), from 0.1x to 25x pet power, each ~4.75% stronger
# than the one before. PRICES are 500 "basic cubes" at the weapon's point on
# the zone ladder (interpolated between zones), so each lands as you reach
# it however far the coin ladder climbs.
#
# BALANCE: tap DAMAGE scales freely, but taps can land a killing blow at
# most once a second (TapService#TAP_KILL_COOLDOWN_MILLIS), the pace the
# pets kill at - so no weapon makes clicking out-kill the pets. With the top
# weapon and Auto Tap a full run is ~3.5% faster. See BALANCE.md.
#
# Fields:
#   display-name   & colour codes work. No descriptions - every weapon's
#                  menu entry and item show the same generated stats, so the
#                  whole path reads as one consistent list.
#   material       the item held - any Minecraft item
#   power          tap damage as a multiple of pet power, while held
#   cost-coins     price to unlock (needs every weapon above it first)
#
# Adding a weapon: add an entry where it belongs. Ownership is a position on
# this list, so prefer appending. Run /admin tools reload after editing.
