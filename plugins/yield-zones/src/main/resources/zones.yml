  # --- The Halloween zone (see yield-events) ---
  # Not part of the ladder. No unlock cost, so anyone can walk in from day
  # one, and cube HP is set near the bottom of the ladder so a brand-new
  # player can actually break them - the event is for everyone, and a zone
  # only the endgame can farm would be the opposite of that.
  #
  # Its coins are deliberately poor: about what the third zone pays, which
  # is pocket change to anyone past it. Coming here means giving up your
  # normal income for a while, and what you get for that is Candy Corn (see
  # yield-events' events.yml) - not a better place to earn.
  #
  # Its chests hand out the event egg itself, which is the one free source
  # of one.
  #
  # It has no "unlock:" and is still not walkable year-round: yield-events
  # registers an access gate on it, so walking in or fast-travelling to it
  # is refused whenever its event is not running, and anyone left inside
  # when it ends is sent back to spawn. That is a date check in code, not a
  # thing to edit here - leave the zone defined all year.
  halloween:
    display-name: "&6Haunted Hollow"
    world: spawn
    corner-one: [10.5, 98, 1932.5]
    corner-two: [-10.5, 150, 1990.5]
    respawn-delay-seconds: 3
    max-concurrent-cubes: 12
    cube-tiers:
