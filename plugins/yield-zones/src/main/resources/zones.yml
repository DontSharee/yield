# Zones are cuboid regions where ore cubes fall from the sky and can be
# fought (see OreCubeService). Run /admin zones reload after editing this
# file to apply changes without restarting the server.
#
# "world" must match a currently-loaded world's name exactly - if it
# doesn't, this zone is skipped (with a warning) rather than crashing the
# whole file's load. corner-one/corner-two are two opposite block
# coordinates [x, y, z]; any two opposite corners work, order doesn't
# matter.
#
# "unlock:" - omit this section entirely for a zone that's free and already
# unlocked for everyone (meadow, below). Configure it (any combination of
# coins/diamonds/items) to gate a zone behind a purchase. A zone with a real
# unlock cost also needs a "walls:" list (one or more cuboids - same
# corner-one/corner-two shape as the zone region itself) to actually
# barricade it; walking into a locked zone's own region is blocked
# server-side regardless of whether a wall is configured, so "walls:" is
# about the VISUAL barricade, not the enforcement itself.
#
# "teleport: [x, y, z, yaw, pitch]" - where fast travel and a locked zone's
# purchase-confirm both send the player. yaw/pitch are optional (default 0).
# Omit entirely to fall back to the zone region's own horizontal center,
# standing on whatever terrain is actually there.
#
# ---------------------------------------------------------------------------
# BALANCE - read this before touching any number below.
#
# Every zone is built from ONE headline number: its tier-1 coin value. The
# ladder runs 1K -> 2.5K -> 6.5K -> 17.5K -> 45K -> 120K -> ... -> 67.5B, roughly
# 2.6x per zone, and it is deliberately made of round numbers so a player
# can read the jump at a glance. Everything else is a fixed ratio off it:
#
#   tier-1 max-hp        40x the tier-1 coin value (softer for zones 1-5,
#                        where a brand-new player is still fighting with
#                        one starter pet)
#   tier-2               3x hp,  4x coins,  3x xp,  3x diamonds, weight 25
#   tier-3               7x hp, 12x coins,  8x xp,  8x diamonds, weight 5
#
# Tier 3 pays 12x for 7x the HP on purpose - the rare big cube is worth
# stopping for, which is what makes a bonus-rolled one exciting rather
# than a chore.
#
# The pacing lives in "unlock:", which is a uniform ~4x per zone, every step
# a round number. Combat itself is calibrated so that:
#   - you WALK IN to a new zone carrying the previous zone's pets and need
#     ~4 seconds per cube, which is the wall
#   - you buy that zone's own packs and settle at ~1.6 seconds per cube,
#     which is the payoff - a ~2.7x throughput jump, every single zone
#
# Measured against an end-to-end playthrough of these exact files (a free
# account, starter pet to Genesis Core, spending as it goes on packs,
# rebirths, upgrade stations and the skill tree):
#
#   Frostpeak      5 min      Netherite Wastes   2.0 h
#   Sulfur Flats  20 min      End Barrens        3.0 h
#   Crystal Cav.  41 min      Starlight Fields   5.9 h
#   Emerald Dep.   1.2 h      Eternal Forge      9.1 h
#   Obsidian Rift  1.4 h      Genesis Core      14.9 h
#
# Five zones inside the first half hour; the gap between unlocks grows about
# 40x across the ladder, from 5 minutes to 3.4 hours. Fast at first, slower
# later, and a visible power spike on every single zone entry.
#
# These are a calibrated starting point, not a guarantee - a player with
# better luck, a donor rank, or a deep rebirth count will beat them, and
# that is fine. What matters is the SHAPE. See BALANCE.md at the repo root
# for the full model and which knob to turn for what.
#
# Geometry: every zone is a real, measured 23 (X) x 59 (Z) block cuboid,
# floor at Y 98 and ceiling at Y 150, laid out down the real spawn corridor
# along +Z with a 35-block empty gap between each zone's cube-spawn area and
# the next. Each locked zone's glass wall sits 18 blocks past the PREVIOUS
# zone's corner-two (i.e. centered in that 35/36-block gap, 18 blocks from
# either side) - 43 blocks wide (wider than the zone itself so it fully
# blocks the corridor), 1 block thick, 35 tall, floor-anchored. The per-zone
# Z pitch is therefore 59 (zone length) + 35 (gap, fencepost-corrected to 36
# between center coordinates) = 94.

# ---------------------------------------------------------------------------
# GIANT CUBES - bigger versions of what falls, in every zone.
#
# Written once here and derived per zone at load, priced off that zone's own
# cubes - the same way Huge pets are derived from normal ones - so nothing
# below needs touching when the ladder does. Two shapes:
#
#   material: ZONE   a giant copy of EACH of the zone's ordinary cubes. A
#                    giant stone cube is a stone cube with more HP and more
#                    pay, not a different thing. "chance" is how often any
#                    given cube comes giant.
#   material: <X>    one extra cube of that block, priced off the zone's
#                    TOUGHEST ordinary cube. "chance" is its share of all
#                    spawns. This is the jackpot - the big safe.
#
#   size          edge length in blocks, 1.0 - 2.0. Everything about the
#                 cube scales with it: the fall, the body, the bonus glow,
#                 the look-at outline, the click hitbox, the hit squish, the
#                 HP label, where pets aim. Capped at 2 because giants keep
#                 one column clear around them and a 2-block cube reaches
#                 exactly to its edge.
#   label         shown above the HP bar and on the boss bar. & codes work.
#   glow          optional, one of vanilla's 16 named colors - a see-through-
#                 walls outline so it can be spotted across the zone, the
#                 same one bonus cubes and treasure chests already use. A
#                 giant that ALSO rolls a golden/diamond bonus keeps the
#                 bonus's glow and its multiplier.
#   *-multiplier  times the base cube's own hp / coins / diamonds / xp.
#   enchant-book-chance
#                 optional - this cube's chance to drop an Enchant Book,
#                 overriding the global one below.
#   enchant-book-min-rarity
#                 optional - the lowest rarity that book can be (a rarity
#                 id from packs.yml). Unset means any.
#   landing-title optional - a full-screen title when it lands, for the
#                 cubes whose arrival should be an event.
#
# Treasure chests never come giant - they are already their zone's event.
#
# The BOSS BLOCK is the 2x2x2 at the top of the pecking order: roughly one
# an hour of steady play, a title card when it lands, a red glow, a real
# fight (15x the zone's toughest cube - pets ring it wider so they stand
# clear of it), and a GUARANTEED Enchant Book of Epic or better. The book
# is its prize; its coins are held to 10x so it costs the ladder under 1%
# on its own.
#
# Every giant is solid across its whole body, not just the one-block
# barrier underneath - an invisible shulker scaled to its size gives the
# owner an exact-size collision box (see OreCubeService#spawnCollision).
#
# BALANCE: this is a deliberate budget, not free. Spawns are capped per
# player, and a settled player one-shots most cubes, so a rarer, richer
# cube is extra income more than it is extra time - the same reason tier 3
# and golden cubes are worth stopping for. Measured against the pacing
# model at the numbers below (three seeds, free player), a full run to the
# Genesis Core is about 14% faster than without giants - 13.1 h to 11.4 h,
# spread evenly across the ladder. Of that, the giants are about 4%, the
# big safe about 10% and the boss block under 1%: the safe is the coin
# jackpot, so it is the expensive part. Turn its chance down first if the
# ladder needs its time back.
#
# The giant copies keep the same pay per hit as the cube they copy, so a
# player fighting at the edge of their power (just walked into a zone)
# gains almost nothing from them - it is the overpowered player breezing
# through a zone who comes out ahead, which is the right person to reward.
#
# The safe has to top the zone's pecking order or it is a disappointment
# with a label on: normal < giant < treasure chest < BIG SAFE. It pays 6x
# the zone's best ordinary cube - more coins than the chest, twice a giant
# tier 3 - for 5x its HP. That richness is why it is rare: 0.4%, about one
# in every 250 spawns, a handful an hour of steady play. (At 3x and 0.75%
# it paid exactly what a giant tier 3 did, for more HP - the rarest thing
# on screen was the worst deal on it.)
#
# Diamonds are held lower than coins on purpose. They gate ranks and pet
# enchants, which the pacing model does not cover, and a safe that paid
# diamonds at its coin rate would add roughly half again to diamond income
# on its own.
giant-cubes:
  giant:
    label: "&e&lGIANT"
    material: ZONE
    size: 1.3
    chance: 0.025
    hp-multiplier: 3
    coin-multiplier: 3
    diamond-multiplier: 2
    xp-multiplier: 3
  big_safe:
    label: "&a&lBIG SAFE"
    # A vault - the trial-chamber block - is the closest thing vanilla has
    # to a safe, and reads as one at 1.5x.
    material: VAULT
    size: 1.5
    chance: 0.004
    glow: green
    hp-multiplier: 5
    coin-multiplier: 6
    diamond-multiplier: 2
    xp-multiplier: 3
    # A book in one safe in twenty, against one cube in 2,500 normally.
    enchant-book-chance: 0.05
  boss_block:
    label: "&c&lBOSS BLOCK"
    landing-title: "&c&lBOSS BLOCK!"
    material: REINFORCED_DEEPSLATE
    size: 2.0
    # About one in every 3,300 spawns - roughly once an hour of play.
    chance: 0.0003
    glow: red
    hp-multiplier: 15
    coin-multiplier: 10
    diamond-multiplier: 3
    xp-multiplier: 10
    enchant-book-chance: 1.0
    enchant-book-min-rarity: epic

# ---------------------------------------------------------------------------
# ENCHANT BOOKS - every cube's chance to drop one when it dies, before luck.
#
# Very rare on purpose. Books used to drop from one hatch in twenty, which
# the pacing model puts at about 68 books an hour - one every 53 seconds -
# so every book was junk and nobody read what they got. At 1 in 2,500 a
# steady player finds about 1.4 an hour from ordinary cubes, plus the odd
# one from a safe and one a boss block always carries: three or so an hour
# in all, with the hourly Enchant Market (yield-packs' enchant-market.yml)
# as the steady, choosable source alongside.
#
# A giant's own "enchant-book-chance" above overrides this for that cube.
enchant-book-chance: 0.0004

zones:
  meadow:
    display-name: "&aMeadow"
    world: spawn
    corner-one: [10.5, 98, 51.5]
    corner-two: [-10.5, 150, 109.5]
    respawn-delay-seconds: 3
    # How many cubes any one player can have live at once in this zone -
    # each player's cubes are their own private, client-side instance, so
    # there's no server-wide total to also cap.
    max-concurrent-cubes: 10
    # tier-1 is the headline number; tier-2/3 are fixed ratios off it
    # (see this file's own BALANCE header).
    cube-tiers:
      - { material: STONE, max-hp: 12000, coin-value: 1000, diamond-value: 10, xp-value: 20, weight: 100 }
      - { material: COPPER_BLOCK, max-hp: 36000, coin-value: 4000, diamond-value: 30, xp-value: 60, weight: 25 }
      - { material: IRON_BLOCK, max-hp: 84000, coin-value: 12000, diamond-value: 80, xp-value: 160, weight: 5 }
    # Independent of which tier gets rolled above - every spawned cube also
    # rolls each of these on its own. If more than one hits at once, the
    # highest multiplier wins. "color" must be one of vanilla's 16 named
    # team colors (gold/aqua/light_purple/etc) - glow color is a hard
    # vanilla limitation, not an arbitrary hex value.
    # TREASURE - the zone's one "stop what you're doing" moment.
    #
    # Mechanically an ordinary cube tier (it falls, has HP, takes damage and
    # pays out through the same path), with three differences that are all
    # about making it an event: it always glows gold so it can be spotted
    # from across the zone, it pays roughly 6x the coins per point of HP that
    # a normal cube does, and it hands over a stack of this zone's own packs.
    #
    # weight 0.6 against the tiers' 100/25/5 is 1 in 218 cubes - about one
    # chest every six minutes at the balanced kill rate. It takes ~10 seconds
    # to break, which is the pause it is meant to be, and is worth ~14% on top
    # of everything else earned in the window between two of them.
    #
    # The packs, not the coins, are the point: coins are already what the
    # inflated coin-value pays, and a second pile of them would just be a
    # bigger number. Packs are what a player turns into power, so a chest
    # reads as "your squad just got better".
    treasure:
      material: CHEST
      weight: 0.6
      max-hp: 120000
      coin-value: 60000
      diamond-value: 250
      xp-value: 300
      reward-pack: zone_meadow_pack
      reward-pack-amount: 8
    cube-bonuses:
      - { id: golden, chance: 0.05, multiplier: 2.0, color: gold }
      - { id: diamond, chance: 0.01, multiplier: 3.0, color: aqua }
      - { id: pinata, chance: 0.008, multiplier: 3.0, color: yellow }
      - { id: rainbow, chance: 0.002, multiplier: 10.0, color: light_purple }
    teleport: [0, 99, 51, 0, 0]

