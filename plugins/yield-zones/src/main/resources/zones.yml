# Zones are cuboid regions where ore cubes fall from the sky and can be
# fought (see OreCubeService). Run /admin zones reload after editing this
# file to apply changes without restarting the server.
#
# "world" must match a currently-loaded world's name exactly - if it
# doesn't, this zone is skipped (with a warning) rather than crashing the
# whole file's load. corner-one/corner-two are two opposite block
# coordinates [x, y, z]; any two opposite corners work, order doesn't
# matter.
#
# "unlock:" - omit this section entirely for a zone that's free and already
# unlocked for everyone (meadow, below). Configure it (any combination of
# coins/diamonds/items) to gate a zone behind a purchase. A zone with a real
# unlock cost also needs a "walls:" list (one or more cuboids - same
# corner-one/corner-two shape as the zone region itself) to actually
# barricade it; walking into a locked zone's own region is blocked
# server-side regardless of whether a wall is configured, so "walls:" is
# about the VISUAL barricade, not the enforcement itself.
#
# "teleport: [x, y, z, yaw, pitch]" - where fast travel and a locked zone's
# purchase-confirm both send the player. yaw/pitch are optional (default 0).
# Omit entirely to fall back to the zone region's own horizontal center,
# standing on whatever terrain is actually there.
#
# ---------------------------------------------------------------------------
# BALANCE - read this before touching any number below.
#
# Every zone is built from ONE headline number: its tier-1 coin value. The
# ladder runs 10 -> 25 -> 65 -> 175 -> 450 -> 1.2K -> ... -> 675M, roughly
# 2.6x per zone, and it is deliberately made of round numbers so a player
# can read the jump at a glance. Everything else is a fixed ratio off it:
#
#   tier-1 max-hp        4x the tier-1 coin value (softer for zones 1-5,
#                        where a brand-new player is still fighting with
#                        one starter pet)
#   tier-2               3x hp,  4x coins,  3x xp,  3x diamonds, weight 25
#   tier-3               7x hp, 12x coins,  8x xp,  8x diamonds, weight 5
#
# Tier 3 pays 12x for 7x the HP on purpose - the rare big cube is worth
# stopping for, which is what makes a bonus-rolled one exciting rather
# than a chore.
#
# The pacing lives in "unlock:", which is a uniform ~4x per zone, every step
# a round number. Combat itself is calibrated so that:
#   - you WALK IN to a new zone carrying the previous zone's pets and need
#     ~4 seconds per cube, which is the wall
#   - you buy that zone's own packs and settle at ~1.6 seconds per cube,
#     which is the payoff - a ~2.7x throughput jump, every single zone
#
# Measured against an end-to-end playthrough of these exact files (a free
# account, starter pet to Genesis Core, spending as it goes on packs,
# rebirths, upgrade stations and the skill tree):
#
#   Frostpeak      5 min      Netherite Wastes   2.0 h
#   Sulfur Flats  20 min      End Barrens        3.0 h
#   Crystal Cav.  41 min      Starlight Fields   5.9 h
#   Emerald Dep.   1.2 h      Eternal Forge      9.1 h
#   Obsidian Rift  1.4 h      Genesis Core      14.9 h
#
# Five zones inside the first half hour; the gap between unlocks grows about
# 40x across the ladder, from 5 minutes to 3.4 hours. Fast at first, slower
# later, and a visible power spike on every single zone entry.
#
# These are a calibrated starting point, not a guarantee - a player with
# better luck, a donor rank, or a deep rebirth count will beat them, and
# that is fine. What matters is the SHAPE. See BALANCE.md at the repo root
# for the full model and which knob to turn for what.
#
# Geometry: every zone is a real, measured 23 (X) x 59 (Z) block cuboid,
# floor at Y 98 and ceiling at Y 150, laid out down the real spawn corridor
# along +Z with a 35-block empty gap between each zone's cube-spawn area and
# the next. Each locked zone's glass wall sits 18 blocks past the PREVIOUS
# zone's corner-two (i.e. centered in that 35/36-block gap, 18 blocks from
# either side) - 43 blocks wide (wider than the zone itself so it fully
# blocks the corridor), 1 block thick, 35 tall, floor-anchored. The per-zone
# Z pitch is therefore 59 (zone length) + 35 (gap, fencepost-corrected to 36
# between center coordinates) = 94.

zones:
  meadow:
    display-name: "&aMeadow"
    world: world
    corner-one: [10.5, 98, 51.5]
    corner-two: [-10.5, 150, 109.5]
    respawn-delay-seconds: 3
    # How many cubes any one player can have live at once in this zone -
    # each player's cubes are their own private, client-side instance, so
    # there's no server-wide total to also cap.
    max-concurrent-cubes: 10
    # tier-1 is the headline number; tier-2/3 are fixed ratios off it
    # (see this file's own BALANCE header).
    cube-tiers:
      - { material: STONE, max-hp: 12, coin-value: 10, diamond-value: 1, xp-value: 20, weight: 100 }
      - { material: COPPER_BLOCK, max-hp: 36, coin-value: 40, diamond-value: 3, xp-value: 60, weight: 25 }
      - { material: IRON_BLOCK, max-hp: 84, coin-value: 120, diamond-value: 8, xp-value: 160, weight: 5 }
    # Independent of which tier gets rolled above - every spawned cube also
    # rolls each of these on its own. If more than one hits at once, the
    # highest multiplier wins. "color" must be one of vanilla's 16 named
    # team colors (gold/aqua/light_purple/etc) - glow color is a hard
    # vanilla limitation, not an arbitrary hex value.
    cube-bonuses:
      - { id: golden, chance: 0.05, multiplier: 2.0, color: gold }
      - { id: diamond, chance: 0.01, multiplier: 3.0, color: aqua }
    teleport: [0, 99, 51, 0, 0]

