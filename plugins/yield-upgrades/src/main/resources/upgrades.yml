# Player upgrades - a handful of global per-player stat boosts, bought by
# physically right-clicking a fake button in the world (no GUI at all - see
# UpgradeStationDisplay). Run /admin upgrades reload after editing this file.
#
# "types:" defines the upgrades themselves - id, effect, per-level value(s),
# max level, and a cost curve. A player's LEVEL in each type is global and
# persists across every zone (PackPlayerProfile#getUpgradeLevels).
#
# "stations:" places physical stations in the world. The same type can
# appear at several zones with different "cap" values - the global level
# above only caps out at whichever station's cap you're currently pushing
# against, so unlocking a later zone with a higher cap lets you keep going
# on a stat you were already maxed on elsewhere.
#
# Cost = cost-base * cost-growth^level (an exponential per-level curve -
# many small, frequent purchases, unlike the rarer big milestone jumps
# player/pet leveling uses a power curve for).
#
# BALANCE - upgrades are paid in DIAMONDS, not coins. Diamond income grows
# about 2.3x a zone (zones.yml's diamond-value ladder), and a type's cap
# climbs 10 levels per station zone - one every two zones, ~5.3x the
# diamonds - so the common types grow 1.18x a level (1.18^10 ~ 5.2): the
# next ten levels always cost about what the next two zones pay. Coin and
# Damage Boost start at 1 diamond and reach ~13M at level 100, next to
# Genesis Core's own 15M diamond unlock. The rarer, stronger types start
# higher and climb faster over their short ladders.
#
# The other half of that is the "stations:" list at the bottom. There used
# to be exactly five stations, all in Meadow, all capped at level 10 - so
# Coin Boost and Damage Boost were permanently stuck at +10% no matter how
# deep a player got. There is now a full set at every other zone, each with
# a cap 10 levels higher than the last, so the caps climb alongside the
# zones the player is actually clearing.

types:
  coin_boost:
    display-name: "&6Coin Boost"
    icon: GOLD_INGOT
    effect: COIN_MULTIPLIER
    value-per-level: 0.01      # +1% coins per level
    max-level: 100
    cost-base: 10
    cost-growth: 1.18
  # id stays "gem_boost" - it's the literal key persisted per-player in
  # PackPlayerProfile#getUpgradeLevels, so renaming it here would orphan
  # every existing player's already-purchased levels in this upgrade.
  gem_boost:
    display-name: "&bDiamond Boost"
    icon: DIAMOND
    effect: DIAMOND_BOOST
    chance-per-level: 0.001    # +0.1% diamond drop chance per level
    flat-per-level: 0.02       # +0.02 flat diamonds per level (rounded at payout)
    max-level: 100
    cost-base: 20
    cost-growth: 1.18
  damage_boost:
    display-name: "&cDamage Boost"
    icon: IRON_SWORD
    effect: DAMAGE_MULTIPLIER
    value-per-level: 0.01      # +1% damage per level
    max-level: 100
    cost-base: 10
    cost-growth: 1.18
  rebirth_boost:
    display-name: "&dRebirth Boost"
    icon: NETHER_STAR
    effect: REBIRTH_GRANT_MULTIPLIER
    value-per-level: 0.01      # +1% bonus EFFECTIVE rebirths granted per rebirth, per level
    max-level: 50
    cost-base: 50
    cost-growth: 1.2
  speed_boost:
    display-name: "&aSpeed Boost"
    icon: SUGAR
    effect: PLAYER_SPEED
    value-per-level: 0.002     # added directly to walk speed (vanilla base 0.2) per level
    max-level: 20
    cost-base: 30
    cost-growth: 1.2
  # More cubes on the floor at once is the single strongest quality-of-life
  # buy in the game (it removes waiting entirely), so it is priced like it.
  cube_cap_boost:
    display-name: "&eCube Capacity"
    icon: CHEST
    effect: CUBE_CAP_BONUS
    value-per-level: 1        # +1 concurrent cube slot per level (zones ship with a base of 10)
    max-level: 10
    cost-base: 150
    cost-growth: 1.5
  cube_luck_boost:
    display-name: "&dLucky Cubes"
    icon: NAUTILUS_SHELL
    effect: CUBE_BONUS_CHANCE
    value-per-level: 0.002    # +0.2% chance per level, added to every zone's golden/diamond cube-bonus roll
    max-level: 25
    cost-base: 80
    cost-growth: 1.3
  # This one directly shortens the 1-second squad retarget that sets the
  # floor on kill speed - at max level it cuts ~30% off every cube's time.
  # Priced as the most expensive thing on the wall for exactly that reason.
  auto_switch_speed:
    display-name: "&bQuick Reflexes"
    icon: FEATHER
    effect: AUTO_SWITCH_SPEED
    value-per-level: 0.05     # +5% faster Auto Mode target-switching per level
    max-level: 10
    cost-base: 200
    cost-growth: 1.5

# Stations sit on each zone's own real floor (Y 98, see zones.yml) just
# inside the entrance, spread across the zone's width so they don't crowd
# each other. Every other zone carries a full set; each set's "cap" is 10
# levels higher than the previous one, so a stat you maxed in Meadow opens
# back up the moment you buy into Iron Foothills. Adjust the coordinates
# in-game once the later zones are actually built - the Z values follow
# zones.yml's own 94-block per-zone pitch, same as every other station in
# this repo.

stations:
  # Upgrades arrive gradually: Meadow has only Coin Boost and Damage Boost,
  # and each station zone after it adds a type or two until Diamond Hollow
  # has the full set. Every row is centred on the zone path (corner x
  # = -2(n-1) + 4i, so a row of any length sits around x = 0.5), spaced
  # 4 blocks apart. Caps for Coin/Damage still climb 10 per station zone,
  # which is all the pacing model (BALANCE.md) reads from this list.
  # meadow - Coin Boost and Damage Boost only - the two that matter from minute one
  - { zone: meadow, type: coin_boost, cap: 10, location: [spawn, -2, 98, 58, 180, 0] }
  - { zone: meadow, type: damage_boost, cap: 10, location: [spawn, 2, 98, 58, 180, 0] }
  # iron_foothills - adds Gem Boost and Cube Luck
  - { zone: iron_foothills, type: gem_boost, cap: 10, location: [spawn, -6, 98, 246, 180, 0] }
  - { zone: iron_foothills, type: coin_boost, cap: 20, location: [spawn, -2, 98, 246, 180, 0] }
  - { zone: iron_foothills, type: damage_boost, cap: 20, location: [spawn, 2, 98, 246, 180, 0] }
  - { zone: iron_foothills, type: cube_luck_boost, cap: 10, location: [spawn, 6, 98, 246, 180, 0] }
  # scorched_wastes - adds Speed and Cube Cap
  - { zone: scorched_wastes, type: speed_boost, cap: 10, location: [spawn, -10, 98, 434, 180, 0] }
  - { zone: scorched_wastes, type: gem_boost, cap: 20, location: [spawn, -6, 98, 434, 180, 0] }
  - { zone: scorched_wastes, type: coin_boost, cap: 30, location: [spawn, -2, 98, 434, 180, 0] }
  - { zone: scorched_wastes, type: damage_boost, cap: 30, location: [spawn, 2, 98, 434, 180, 0] }
  - { zone: scorched_wastes, type: cube_luck_boost, cap: 20, location: [spawn, 6, 98, 434, 180, 0] }
  - { zone: scorched_wastes, type: cube_cap_boost, cap: 10, location: [spawn, 10, 98, 434, 180, 0] }
  # diamond_hollow - adds Rebirth Boost and Auto-Switch Speed
  - { zone: diamond_hollow, type: rebirth_boost, cap: 20, location: [spawn, -12, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: speed_boost, cap: 20, location: [spawn, -8, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: gem_boost, cap: 30, location: [spawn, -4, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: coin_boost, cap: 40, location: [spawn, 0, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: damage_boost, cap: 40, location: [spawn, 4, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: cube_luck_boost, cap: 25, location: [spawn, 8, 98, 622, 180, 0] }
  - { zone: diamond_hollow, type: auto_switch_speed, cap: 10, location: [spawn, 12, 98, 622, 180, 0] }
  # obsidian_rift
  - { zone: obsidian_rift, type: rebirth_boost, cap: 35, location: [spawn, -6, 98, 810, 180, 0] }
