# Player upgrades - a handful of global per-player stat boosts, bought by
# physically right-clicking a fake button in the world (no GUI at all - see
# UpgradeStationDisplay). Run /admin upgrades reload after editing this file.
#
# "types:" defines the upgrades themselves - id, effect, per-level value(s),
# max level, and a cost curve. A player's LEVEL in each type is global and
# persists across every zone (PackPlayerProfile#getUpgradeLevels).
#
# "stations:" places physical stations in the world. The same type can
# appear at several zones with different "cap" values - the global level
# above only caps out at whichever station's cap you're currently pushing
# against, so unlocking a later zone with a higher cap lets you keep going
# on a stat you were already maxed on elsewhere.
#
# Cost = cost-base * cost-growth^level (an exponential per-level curve -
# many small, frequent purchases, unlike the rarer big milestone jumps
# player/pet leveling uses a power curve for).
#
# BALANCE - upgrades are paid in DIAMONDS, not coins. Diamond income grows
# about 2.3x a zone (zones.yml's diamond-value ladder), and a type's cap
# climbs 10 levels per station zone - one every two zones, ~5.3x the
# diamonds - so the common types grow 1.18x a level (1.18^10 ~ 5.2): the
# next ten levels always cost about what the next two zones pay. Coin and
# Damage Boost start at 1 diamond and reach ~13M at level 100, next to
# Genesis Core's own 15M diamond unlock. The rarer, stronger types start
# higher and climb faster over their short ladders.
#
# The other half of that is the "stations:" list at the bottom. There used
# to be exactly five stations, all in Meadow, all capped at level 10 - so
# Coin Boost and Damage Boost were permanently stuck at +10% no matter how
# deep a player got. There is now a full set at every other zone, each with
# a cap 10 levels higher than the last, so the caps climb alongside the
# zones the player is actually clearing.

types:
  coin_boost:
    display-name: "&6Coin Boost"
    icon: GOLD_INGOT
    effect: COIN_MULTIPLIER
    value-per-level: 0.01      # +1% coins per level
    max-level: 105
    cost-base: 10
    cost-growth: 1.18
  # id stays "gem_boost" - it's the literal key persisted per-player in
  # PackPlayerProfile#getUpgradeLevels, so renaming it here would orphan
  # every existing player's already-purchased levels in this upgrade.
  gem_boost:
    display-name: "&bDiamond Boost"
    icon: DIAMOND
    effect: DIAMOND_BOOST
    chance-per-level: 0.001    # +0.1% diamond drop chance per level
    flat-per-level: 0.2        # +0.2 flat diamonds per level (rounded at payout)
    max-level: 100
    cost-base: 20
    cost-growth: 1.18
  damage_boost:
    display-name: "&cDamage Boost"
    icon: IRON_SWORD
    effect: DAMAGE_MULTIPLIER
    value-per-level: 0.01      # +1% damage per level
    max-level: 105
    cost-base: 10
    cost-growth: 1.18
  rebirth_boost:
    display-name: "&dRebirth Boost"
    icon: NETHER_STAR
    effect: REBIRTH_GRANT_MULTIPLIER
    value-per-level: 0.01      # +1% bonus EFFECTIVE rebirths granted per rebirth, per level
    max-level: 50
    cost-base: 50
    cost-growth: 1.2
  speed_boost:
    display-name: "&aSpeed Boost"
    icon: SUGAR
    effect: PLAYER_SPEED
    value-per-level: 0.002     # added directly to walk speed (vanilla base 0.2) per level
    max-level: 20
    cost-base: 30
    cost-growth: 1.2
  # More cubes on the floor at once is the single strongest quality-of-life
  # buy in the game (it removes waiting entirely), so it is priced like it.
  cube_cap_boost:
    display-name: "&eCube Capacity"
    icon: CHEST
    effect: CUBE_CAP_BONUS
    value-per-level: 1        # +1 concurrent cube slot per level (zones ship with a base of 10)
    max-level: 10
    cost-base: 150
    cost-growth: 1.5
  cube_luck_boost:
    display-name: "&dLucky Cubes"
    icon: NAUTILUS_SHELL
    effect: CUBE_BONUS_CHANCE
    value-per-level: 0.002    # +0.2% chance per level, added to every zone's golden/diamond cube-bonus roll
    max-level: 25
    cost-base: 80
    cost-growth: 1.3
  # This one directly shortens the 1-second squad retarget that sets the
  # floor on kill speed - at max level it cuts ~30% off every cube's time.
  # Priced as the most expensive thing on the wall for exactly that reason.
  auto_switch_speed:
    display-name: "&bQuick Reflexes"
    icon: FEATHER
    effect: AUTO_SWITCH_SPEED
    value-per-level: 0.05     # +5% faster Auto Mode target-switching per level
    max-level: 10
    cost-base: 200
    cost-growth: 1.5


  # Coins and diamonds drop out of cubes and fly to you once you're this
  # close (base 6 blocks - see LootDropService). Cheap, and early, because
  # it's the upgrade you feel on every single kill.
  magnet_range:
    display-name: "&eMagnet"
    icon: IRON_INGOT
    effect: MAGNET_RANGE
    value-per-level: 1         # +1 block of pickup range per level
    max-level: 15
    cost-base: 15
    cost-growth: 1.74          # 3 levels per station zone, ~5.3x the diamonds each step
  # --- Arrive one zone at a time after Diamond Hollow's set (see stations:). ---
  # Costs start near what a Coin Boost level costs in the zone each one
  # arrives in, and grow so each station's step of levels costs about two
  # zones of diamond income - the same rule the types above follow.
  tap_power:
    display-name: "&6Tap Power"
    icon: GOLDEN_SWORD
    effect: TAP_DAMAGE
    value-per-level: 0.03      # +3% tap damage per level
    max-level: 50
    cost-base: 20
    cost-growth: 1.18
  crit_chance:
    display-name: "&eCritical Strike"
    icon: BLAZE_POWDER
    effect: CRIT_CHANCE
    value-per-level: 0.005     # +0.5% crit chance per level, on top of the base 10%
    max-level: 30
    cost-base: 150
    cost-growth: 1.4
  diamond_multiplier:
    display-name: "&bDiamond Multiplier"
    icon: DIAMOND_BLOCK
    effect: DIAMOND_MULTIPLIER
    value-per-level: 0.02      # +2% diamonds per level
    max-level: 50
    cost-base: 800
    cost-growth: 1.18
  attack_speed:
    display-name: "&cSwift Strikes"
    icon: RABBIT_FOOT
    effect: ATTACK_SPEED
    value-per-level: 0.01      # +1% pet attack speed per level
    max-level: 30
    cost-base: 5000
    cost-growth: 1.4
  hatch_luck:
    display-name: "&aHatch Luck"
    icon: EMERALD
    effect: HATCH_LUCK
    value-per-level: 0.02      # +2% hatch luck per level
    max-level: 40
    cost-base: 12000
    cost-growth: 1.23
  quick_respawn:
    display-name: "&7Quick Respawn"
    icon: CLOCK
    effect: RESPAWN_SPEED
    value-per-level: 0.01      # cubes respawn 1% faster per level
    max-level: 30
    cost-base: 30000
    cost-growth: 1.32
  double_hit:
    display-name: "&4Double Hit"
    icon: NETHERITE_SWORD
    effect: DOUBLE_HIT
    value-per-level: 0.002     # +0.2% chance a pet hit lands twice, per level
    max-level: 25
    cost-base: 60000
    cost-growth: 1.4
  # --- The late set: zones 12-15 each add one. ---
  pet_slots:
    display-name: "&dExtra Pet Slot"
    icon: LEAD
    effect: PET_SLOTS
    value-per-level: 1         # +1 equipped pet per level
    max-level: 3
    cost-base: 2000000
    cost-growth: 5.3           # one level every two zones, about two zones of diamonds each
  triple_hit:
    display-name: "&4Triple Hit"
    icon: TRIDENT
    effect: TRIPLE_HIT
    value-per-level: 0.001     # +0.1% chance a pet hit lands a third time, per level
    max-level: 20
    cost-base: 300000
    cost-growth: 1.4
  hatch_speed:
    display-name: "&eHatch Speed"
    icon: EGG
    effect: HATCH_SPEED
    value-per-level: 0.02      # hatching 2% faster per level
    max-level: 20
    cost-base: 1000000
    cost-growth: 1.4
  rare_finds:
    display-name: "&6Rare Finds"
    icon: CHEST
    effect: RARE_FINDS
    value-per-level: 0.03      # giants and treasure chests spawn 3% more often per level
    max-level: 25
    cost-base: 2000000
    cost-growth: 1.35

# Every zone has stations now, and the upgrades arrive gradually: Meadow
# has only Coin Boost and Damage Boost, and almost every zone up to
# Celestial Sanctum adds a new type (its comment line below says which).
# Coin and Damage are in every zone, their cap 5 levels higher each time
# (the pacing sim reads those two). Every other type raises its cap every
# second zone from the zone it arrives in, so each zone offers something
# new to buy.
#
# Layout: stations sit on the zone floor (Y 98) 6.5 blocks past the
# entrance, in rows of at most five, 4 blocks apart and centred on the
# path (corner x = -2(n-1) + 4i). A zone with more than five gets a second
# row 4 blocks further in. Zones are 21 blocks wide, so five is the most a
# row fits. Adjust coordinates in-game once the later zones are built -
# the Z values follow zones.yml's 94-block per-zone pitch.

stations:
  # meadow (zone 1) - 2 stations, new: Coin Boost, Damage Boost
  - { zone: meadow, type: coin_boost, cap: 10, location: [spawn, -2, 98, 58, 180, 0] }
  - { zone: meadow, type: damage_boost, cap: 10, location: [spawn, 2, 98, 58, 180, 0] }
