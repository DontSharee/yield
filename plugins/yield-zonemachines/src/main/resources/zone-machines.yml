# Walk-in triggers: NOT smacked - a spinning particle ring you physically
# walk into. Unlike the machines above, these are NOT one-per-zone - each of
# the 4 types below sits at exactly ONE specific zone (not every zone),
# deliberately spread out through progression rather than bunched at the
# easy starting zones (meadow through sulfur_flats, zones 0-3, have none of
# these on purpose):
#   GOLDEN_FUSION      - zone 5  (crystal_caverns)
#   ENCHANTS           - zone 4  (scorched_wastes) - opens /enchants; the
#                        first "big kid" zone, right after the free starting
#                        ones - reconsider this placement if it feels off.
#   RAINBOW_FUSION     - zone 10 (netherite_wastes)
#   DARK_MATTER_FUSION - zone 15 (starlight_fields)
# GOLDEN/RAINBOW/DARK_MATTER_FUSION each open the SAME Fusion GUI, but
# locked to producing ONLY that one tier - there is no "fuse into anything"
# screen anymore, so a Rainbow-eligible pet can only actually become Rainbow
# by walking into the Rainbow ring specifically. RANKUP was removed from
# here - Ranks are bought with diamonds at any time, so gating that behind one
# physical zone was odd friction; it's a plain "/rankup" command now (see
# RankupCommand), meant for an NPC at spawn to run instead.
# Run /admin zonemachines reload after editing this file.
walk-in-triggers:
  - zone: scorched_wastes
    type: ENCHANTS
    location: [spawn, -7.5, 99, 457.5, 90, 0]
  - zone: crystal_caverns
    type: GOLDEN_FUSION
    location: [spawn, -11.5, 99, 556.5, 90, 0]
  - zone: netherite_wastes
    type: RAINBOW_FUSION
    location: [spawn, -11.5, 99, 1027.5, 90, 0]
  - zone: starlight_fields
    type: DARK_MATTER_FUSION
    location: [spawn, -7.5, 99, 1506.5, 90, 0]
