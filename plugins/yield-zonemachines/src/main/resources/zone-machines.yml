# Two physical machines per zone, "smacked" (left-click/attack, same
# convention as the pack stations) to trigger:
#   REBIRTH      - performs a real rebirth right there (as many as you can
#                  currently afford in one smack) - previously /rebirth only.
#   CANDY_APPLY  - opens a small drag-and-drop menu (see CandyApplyGui) -
#                  drop a candy in to feed it straight to your strongest
#                  equipped pet. The existing "hold a candy, click a pet in
#                  /bag" gesture (PetLevelingService#feedCandy) still works
#                  too - this is a second, discoverable, in-world path to it.
# A straight candy-for-coins purchase and a coins-to-diamonds exchange machine
# both used to live here too - removed by design (see git history / the
# session plan if it matters later); REBIRTH is deliberately still every
# zone (not gated to a subset like the walk-in upgrades below).
# Run /admin zonemachines reload after editing this file.
#
# Coordinates extend the same real, F3-verified pack-station pavilion
# layout (see yield-packstations' own pack-stations.yml) rather than
# guessing fresh ones: x=-19.5 continues that row (candy-apply 4 blocks past
# the pack station in +Z); x=-15.5 is a second, parallel row 4 blocks east
# (rebirth level with the pack station). Adjust in-game once these are
# actually built, same as every other station in this repo.

machines:
  - zone: meadow
    type: REBIRTH
    location: [spawn, -15.5, 99, 81.5, 90, 0]
  - zone: meadow
    type: CANDY_APPLY
    location: [spawn, -19.5, 99, 77.5, 90, 0]
