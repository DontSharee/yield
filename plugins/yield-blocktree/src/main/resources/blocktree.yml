# Per-block-type progression trees (see /blocktree) - a bestiary for ore
# cubes. Every configured block tracks a player's lifetime break count
# (across every zone that spawns it) against 7 tiers of goals; each tier's
# rewards are a list of typed, permanent effects - fully configurable, add
# or change any of them freely. Run /admin blocktree reload after editing.
#
# Effect types - block-scoped ones (meant for tiers 1-6, small and stacking)
# first, then every GLOBAL/unique one (meant for tier 7 - one big, permanent,
# server-wide perk per block). There's a lot more unique types here than
# blocks configured right now - that's deliberate, so every future block just
# picks whichever one fits it best instead of needing a new hook built.
#
# BLOCK-SCOPED (only affect the specific block whose tree granted them):
#   flat-coins / flat-diamonds / flat-credits - this raw amount is added EVERY
#     time this specific block is broken, on top of its normal payout.
#   block-coin-multiplier / block-diamond-multiplier - "value" is an additive
#     percentage (0.10 = +10%) applied only to this block's own payout,
#     stacking with every other claimed tier of the same type.
#
# GLOBAL / UNIQUE (apply everywhere, regardless of which block or pack
# triggered them - meant to be one per block's tier 7):
#   global-coin-multiplier / global-damage-multiplier - additive percentage
#     applied to every coin payout / every pet attack, same slot rebirth,
#     skill tree, and potions already contribute to.
#   global-attack-speed-multiplier - additive percentage that shortens the
#     delay between every pet's attacks server-wide.
#   roll-speed-multiplier - additive percentage that shortens the cooldown
#     between opening packs.
#   global-luck-boost - additive luck bonus applied everywhere packs are
#     rolled, same slot skill tree/potions already contribute to.
#   double-hit-chance / triple-hit-chance - "value" is a flat chance
#     (0.10 = 10%) for any pet hit to land an extra time - rolled
#     independently of each other, so both can trigger on the same hit.
#   exclusive-find-chance - "value" is a flat chance (0.02 = 2%) for ANY pack
#     opened (even one with no Exclusive in its own pool) to instead hand
#     back a random Exclusive-rarity pet.
#   diamond-chance-boost - "value" is an additive flat chance (0.05 = +5%) added
#     on top of a cube kill's own base diamond-drop roll.
#   progress-multiplier - "value" is an additive percentage (1.0 = +100%,
#     i.e. 2x) applied to how much progress EVERY block break counts for
#     toward its own blocktree, not just this one - makes the whole system
#     faster to climb.
#   unlock-shard-drop - block-scoped, NOT global despite living in this list:
#     permanently unlocks a chance for THIS block's own cube kills to drop a
#     Shard (a physical, right-click-consumed item granting a small
#     PERMANENT stat bonus - see yield-packs' ShardService/ShardType) -
#     "value" is that base drop chance (0.02 = 2%), and "data" names which
#     shard type (DAMAGE/COINS/DIAMONDS). ~5% of hits roll as a rare "Perfect"
#     shard instead (10x the bonus, plus a server-wide broadcast). A shard
#     type can NEVER drop for a player until they've actually claimed the
#     tier that unlocks it.
#
# Tiers are sorted by "goal" automatically, so declaration order doesn't
# matter. A block missing exactly 7 tiers just logs a warning - it still
# works with however many it has.
#
# BALANCE - the old goals (100 / 1,000 / 10,000 ... 2,500,000 Stone) were
# written without reference to how long anyone actually spends in a zone. At
# ~38 cube kills a minute, and with Meadow being a four-minute stop, a
# player breaks about 120 Stone in a whole pass through it - so tier 2 of
# the very first tree was already out of reach and tiers 3-7 were decoration.
#
# Every goal below is derived from that block's own real expected break
# count: how many of it a player breaks in one full pass down the ladder,
# summed over every zone and tier it appears in. Tier 1 is ~10% of one pass
# (a few minutes), tier 4 is ~1.5 passes ("you cleared this properly"), and
# tier 7 is ~25 passes - a deliberate camp, or a lot of rebirth loops.
# Trees were also added for blocks much further down the ladder, so the
# system has something to say in the late game instead of being three
# Meadow blocks. Each tree still ends in exactly one big, permanent,
# server-wide perk, and no block has two.
blocks:
  stone:
    # The block every player breaks first, so it carries the perk that makes the whole system faster to climb - +100% blocktree progress from EVERY block, not just this one.
    # ~117 of these are broken in one full pass down the zone ladder.
    material: STONE
    display-name: "&7Stone"
    icon: STONE
    tiers:
      - goal: 15
        effects:
          - { type: flat-coins, value: 5 }
      - goal: 40
        effects:
          - { type: flat-coins, value: 10 }
      - goal: 100
        effects:
          - { type: flat-coins, value: 20 }
      - goal: 200
        effects:
          - { type: flat-coins, value: 40 }
          - { type: unlock-shard-drop, value: 0.01, data: CRIT_CHANCE }
      - goal: 500
        effects:
          - { type: block-coin-multiplier, value: 0.10 }
          - { type: unlock-shard-drop, value: 0.015, data: LUCK }
      - goal: 1500
        effects:
          - { type: block-coin-multiplier, value: 0.25 }
          - { type: unlock-shard-drop, value: 0.02, data: COINS }
      - goal: 3000
        effects:
          - { type: progress-multiplier, value: 1.0 }

