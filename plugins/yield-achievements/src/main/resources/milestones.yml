# CREDIT BUDGET. Credits are the Store currency - real money buys them at
# 100 to the dollar (see yield-achievements' DonationGoalStore), and they
# are the ONLY way to buy a gamepass, a rank, or a black market egg. What
# this file hands out therefore sets what real money is worth.
#
# The whole game gives away about 1,650 credits across a full playthrough
# (~850 here, ~650 in milestones.yml, the rest from quests and lootboxes),
# which is one cheaper gamepass OR most of one black market hatch: enough
# that a free player gets a taste of the premium shelf, not enough to clear
# it. It used to be 18,985 - more than the entire store costs (15,073), so
# every gamepass, both ranks and a black market egg were free to anyone who
# just played for a while.

# Category-based progress ladders (see /milestones) - fully configurable,
# add as many categories (or tiers per category) as you like, nothing here
# is hardcoded. Every tier within one category tracks the SAME shared
# counter, incremented whenever "trigger" fires - reaching several tiers at
# once (e.g. a huge coin payout) leaves each one independently claimable.
# Run /admin achievements reload after editing.
#
# "trigger" is a GameAction - same enum/list as achievements.yml. Tiers are
# sorted by "goal" automatically, so declaration order doesn't matter.
#
# "reward-potion" is optional (omit for none) - any valid potion id (see
# yield-achievements' PotionDefinition: "POTION_<STAT>_<MULTIPLIER>_<SECONDS>",
# STAT one of COINS/DAMAGE/LUCK/ROLL_SPEED) works, handed over as a real,
# drinkable item on claim rather than auto-consumed.
# BALANCE - unlike daily quests, these are LIFETIME counters, so each tier
# can be aimed at the zone band a player is realistically in when they trip
# it, and the rewards track the coin ladder in zones.yml rather than sitting
# flat. Goals are sized against the real kill rate (~35-40 cubes a minute):
# 250 cubes is the first ten minutes, 300,000 is the whole zone ladder and
# then some. The rebirth ladder stops at 250 because the rebirth curve
# itself runs out of road somewhere past 200 - see yield-rebirth.
categories:
  cubes_killed:
    display-name: "&cCubes Killed"
    icon: IRON_PICKAXE
    trigger: KILL_CUBE
    tiers:
      - { goal: 250, reward-coins: 15000, reward-diamonds: 10, reward-credits: 5 }
      - { goal: 2500, reward-coins: 250000, reward-diamonds: 60, reward-credits: 10, reward-potion: POTION_LUCK_2_600 }
      - { goal: 15000, reward-coins: 8000000, reward-diamonds: 800, reward-credits: 25, reward-potion: POTION_DAMAGE_2_900 }
      - { goal: 75000, reward-coins: 400000000, reward-diamonds: 20000, reward-credits: 50, reward-potion: POTION_LUCK_3_1800 }
      - { goal: 300000, reward-coins: 30000000000, reward-diamonds: 500000, reward-credits: 150, reward-potion: POTION_COINS_3_3600 }

  coins_earned:
    display-name: "&6Coins Earned"
    icon: SUNFLOWER
    trigger: EARN_COINS
    tiers:
      - { goal: 250000, reward-coins: 25000, reward-diamonds: 10, reward-credits: 5 }
      - { goal: 50000000, reward-coins: 5000000, reward-diamonds: 250, reward-credits: 10 }
      - { goal: 25000000000, reward-coins: 2500000000, reward-diamonds: 25000, reward-credits: 25 }
      - { goal: 10000000000000, reward-coins: 1000000000000, reward-diamonds: 2000000, reward-credits: 75 }

  packs_opened:
    display-name: "&fEggs Hatched"
    icon: CHEST
    trigger: OPEN_PACK
    tiers:
      - { goal: 50, reward-coins: 10000, reward-diamonds: 10, reward-credits: 5 }
      - { goal: 500, reward-coins: 1500000, reward-diamonds: 200, reward-credits: 10 }
      - { goal: 3000, reward-coins: 750000000, reward-diamonds: 15000, reward-credits: 25 }
      - { goal: 15000, reward-coins: 150000000000, reward-diamonds: 1000000, reward-credits: 75 }

  rebirths:
    display-name: "&bRebirths"
    icon: NETHER_STAR
    trigger: REBIRTH
    tiers:
      - { goal: 10, reward-coins: 50000, reward-diamonds: 25, reward-credits: 5 }
      - { goal: 50, reward-coins: 10000000, reward-diamonds: 500, reward-credits: 10 }
      - { goal: 125, reward-coins: 5000000000, reward-diamonds: 50000, reward-credits: 50 }
      - { goal: 250, reward-coins: 500000000000, reward-diamonds: 1500000, reward-credits: 150 }
