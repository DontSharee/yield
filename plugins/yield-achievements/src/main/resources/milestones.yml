# Category-based progress ladders (see /milestones) - fully configurable,
# add as many categories (or tiers per category) as you like, nothing here
# is hardcoded. Every tier within one category tracks the SAME shared
# counter, incremented whenever "trigger" fires - reaching several tiers at
# once (e.g. a huge coin payout) leaves each one independently claimable.
# Run /admin achievements reload after editing.
#
# "trigger" is a GameAction - same enum/list as achievements.yml. Tiers are
# sorted by "goal" automatically, so declaration order doesn't matter.
#
# "reward-potion" is optional (omit for none) - any valid potion id (see
# yield-achievements' PotionDefinition: "POTION_<STAT>_<MULTIPLIER>_<SECONDS>",
# STAT one of COINS/DAMAGE/LUCK/ROLL_SPEED) works, handed over as a real,
# drinkable item on claim rather than auto-consumed.
categories:
  cubes_killed:
    display-name: "&cCubes Killed"
    icon: IRON_PICKAXE
    trigger: KILL_CUBE
    tiers:
      - { goal: 100, reward-coins: 1000, reward-gems: 0, reward-credits: 10 }
      - { goal: 1000, reward-coins: 10000, reward-gems: 5, reward-credits: 25, reward-potion: POTION_LUCK_2_600 }
      - { goal: 10000, reward-coins: 100000, reward-gems: 25, reward-credits: 100, reward-potion: POTION_DAMAGE_2_900 }
      - { goal: 100000, reward-coins: 1000000, reward-gems: 100, reward-credits: 500, reward-potion: POTION_LUCK_3_1800 }
      - { goal: 1000000, reward-coins: 10000000, reward-gems: 500, reward-credits: 2500, reward-potion: POTION_COINS_3_3600 }

  coins_earned:
    display-name: "&6Coins Earned"
    icon: SUNFLOWER
    trigger: EARN_COINS
    tiers:
      - { goal: 100000, reward-coins: 5000, reward-gems: 0, reward-credits: 10 }
      - { goal: 1000000, reward-coins: 50000, reward-gems: 10, reward-credits: 50 }
      - { goal: 100000000, reward-coins: 500000, reward-gems: 50, reward-credits: 200 }
      - { goal: 10000000000, reward-coins: 5000000, reward-gems: 250, reward-credits: 1000 }

  packs_opened:
    display-name: "&fPacks Opened"
    icon: CHEST
    trigger: OPEN_PACK
    tiers:
      - { goal: 50, reward-coins: 2000, reward-gems: 0, reward-credits: 10 }
      - { goal: 500, reward-coins: 20000, reward-gems: 10, reward-credits: 50 }
      - { goal: 5000, reward-coins: 200000, reward-gems: 50, reward-credits: 250 }
      - { goal: 50000, reward-coins: 2000000, reward-gems: 200, reward-credits: 1000 }

  rebirths:
    display-name: "&bRebirths"
    icon: NETHER_STAR
    trigger: REBIRTH
    tiers:
      - { goal: 5, reward-coins: 10000, reward-gems: 10, reward-credits: 25 }
      - { goal: 25, reward-coins: 100000, reward-gems: 50, reward-credits: 100 }
      - { goal: 100, reward-coins: 1000000, reward-gems: 250, reward-credits: 500 }
      - { goal: 500, reward-coins: 10000000, reward-gems: 1000, reward-credits: 2500 }
