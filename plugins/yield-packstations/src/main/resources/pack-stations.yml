# One physical station per zone, 'smacked' (left-click/attack) to buy 1
# unit of that zone's own pack into storage - unlimited supply, no shop-
# stock cap, just the pack's own coin-cost/gem-cost from packs.yml. A
# station's 'pack:' must already exist as a pack id in yield-packs' own
# packs.yml. Run /admin packstations reload after editing this file.
#
# Coordinates come from the real, in-game entrance structure built at each
# zone (verified in-game, not a formula guess): x=-19.5, y=99, yaw=90 held
# constant, z=81.5 for meadow (zone index 0) then +95 per zone after that -
# same z-spacing convention zones.yml's own teleport points already use.
# (Adjusted once already from an earlier x=-20.5/y=100/z=82.5 pass per
# in-game feedback: down 1, +1 x, -1 z.)

stations:
  - zone: meadow
    pack: zone_meadow_pack
    location: [world, -19.5, 99, 81.5, 90, 0]
  - zone: frostpeak
    pack: zone_frostpeak_pack
    location: [world, -19.5, 99, 176.5, 90, 0]
  - zone: iron_foothills
    pack: zone_iron_foothills_pack
    location: [world, -19.5, 99, 271.5, 90, 0]
  - zone: sulfur_flats
    pack: zone_sulfur_flats_pack
    location: [world, -19.5, 99, 366.5, 90, 0]
  - zone: scorched_wastes
    pack: zone_scorched_wastes_pack
    location: [world, -19.5, 99, 461.5, 90, 0]
  - zone: crystal_caverns
    pack: zone_crystal_caverns_pack
    location: [world, -19.5, 99, 556.5, 90, 0]
  - zone: diamond_hollow
    pack: zone_diamond_hollow_pack
    location: [world, -19.5, 99, 651.5, 90, 0]
  - zone: emerald_depths
    pack: zone_emerald_depths_pack
    location: [world, -19.5, 99, 746.5, 90, 0]
  - zone: obsidian_rift
    pack: zone_obsidian_rift_pack
    location: [world, -19.5, 99, 841.5, 90, 0]
  - zone: void_expanse
    pack: zone_void_expanse_pack
    location: [world, -19.5, 99, 936.5, 90, 0]
  - zone: netherite_wastes
    pack: zone_netherite_wastes_pack
    location: [world, -19.5, 99, 1031.5, 90, 0]
  - zone: ancient_ruins
    pack: zone_ancient_ruins_pack
    location: [world, -19.5, 99, 1126.5, 90, 0]
  - zone: end_barrens
    pack: zone_end_barrens_pack
    location: [world, -19.5, 99, 1221.5, 90, 0]
  - zone: purpur_spires
    pack: zone_purpur_spires_pack
    location: [world, -19.5, 99, 1316.5, 90, 0]
