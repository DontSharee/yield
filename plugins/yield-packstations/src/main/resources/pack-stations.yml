# The black market: one global rotation shared by every player (NOT
# per-player like the flat shop's own ShopStockService) - every
# reset-interval-minutes, a fresh pack is picked deterministically from
# 'pool' using only the current wall-clock cycle id as the random seed (no
# player identity mixed in), so every player sees the same live pack at
# the same time, for free, with nothing persisted - a restart changes
# nothing since the cycle id is recomputed from the clock every time.
#
# One kiosk is placed at every zone's own entrance (right next to that
# zone's pack station, 4 blocks off in -Z) rather than one single far-off
# location - all of them read the exact same live rotation, so a player
# never has to travel back to one specific spot to check the black market.
black-market:
  reset-interval-minutes: 60
  pool:
    - elite_frostpeak_pack
    - elite_crystal_caverns_pack
    - elite_genesis_core_pack
  stations:
    - location: [world, -19.5, 99, 77.5, 90, 0]
    - location: [world, -19.5, 99, 172.5, 90, 0]
    - location: [world, -19.5, 99, 267.5, 90, 0]
    - location: [world, -19.5, 99, 362.5, 90, 0]
    - location: [world, -19.5, 99, 457.5, 90, 0]
    - location: [world, -19.5, 99, 552.5, 90, 0]
    - location: [world, -19.5, 99, 647.5, 90, 0]
    - location: [world, -19.5, 99, 742.5, 90, 0]
    - location: [world, -19.5, 99, 837.5, 90, 0]
    - location: [world, -19.5, 99, 932.5, 90, 0]
    - location: [world, -19.5, 99, 1027.5, 90, 0]
    - location: [world, -19.5, 99, 1122.5, 90, 0]
    - location: [world, -19.5, 99, 1217.5, 90, 0]
    - location: [world, -19.5, 99, 1312.5, 90, 0]
    - location: [world, -19.5, 99, 1407.5, 90, 0]
