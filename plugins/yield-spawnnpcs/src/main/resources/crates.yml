# Crates - the IN-GAME-CURRENCY counterpart to yield-lootboxes' own real-
# money boxes. Bought with Credits (the achievement/milestone/quest reward
# currency - see PackPlayerProfile#getCredits) at the Crate NPC, opened
# INSTANTLY on purchase (no physical item, no separate right-click step -
# unlike a real-money Lootbox, there's no anticipation-building reason to
# make you carry it around first). Deliberately smaller rewards than
# yield-lootboxes' mythic_crate/exclusive_crate at every tier - these exist
# for steady F2P progression, not to outshine the real-money path. Run
# /admin spawnnpcs reload after editing.
#
# Reward pool entry types (same weighted-pick math as yield-lootboxes'
# own pool, entirely separate config/content):
#   flat-coins / flat-diamonds - "amount" granted directly.
#   pet - "pet-item" is any item id from yield-packs' own packs.yml catalog.
#   commands - runs each of "commands" as CONSOLE, "%player%" substituted.
crates:
  common_crate:
    display-name: "&7&lCommon Crate"
    icon: CHEST
    cost: 25
    pool:
      - { type: flat-coins, weight: 60, amount: 5000 }
      - { type: flat-diamonds, weight: 25, amount: 3 }
      - { type: pet, weight: 12, pet-item: golden_retriever }
      - { type: pet, weight: 3, pet-item: diamond_wolf }

  rare_crate:
    display-name: "&9&lRare Crate"
    icon: TRAPPED_CHEST
    cost: 75
    pool:
      - { type: flat-coins, weight: 55, amount: 20000 }
      - { type: flat-diamonds, weight: 30, amount: 8 }
      - { type: pet, weight: 12, pet-item: star_dragon }
      - { type: pet, weight: 3, pet-item: phoenix_hatchling }

  epic_crate:
    display-name: "&5&lEpic Crate"
    icon: ENDER_CHEST
    cost: 200
    pool:
      - { type: flat-coins, weight: 45, amount: 75000 }
      - { type: flat-diamonds, weight: 35, amount: 20 }
      - { type: pet, weight: 15, pet-item: void_serpent }
      - { type: pet, weight: 5, pet-item: celestial_griffin }
