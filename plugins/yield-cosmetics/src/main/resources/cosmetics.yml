# Chat Colors: "style" wraps the whole chat message (a MiniMessage tag -
# gradients are fine). Nameplates: "style" wraps the player's own name in
# chat, above their head, and in the tab list. Tags: "badge" is prepended
# before the player's name everywhere a nameplate style would apply -
# color and literal text together (e.g. "[VIP] ").
#
# "permission" is what OWNS a cosmetic - omit it entirely for something
# free to everyone. There is no in-game purchase flow: a future store
# grants these permissions directly (e.g. via a redeemable voucher).
