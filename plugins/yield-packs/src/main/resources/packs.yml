packs:
  # --- The merchant ladder (the rotating shop, see ShopStockService) ---
  #
  # Ten rungs, each drawing from a three-zone window of the zone ladder
  # below: its commons/uncommons come from the window's first zone, its
  # rares/epic from the middle one, and its legendary/mythic/secret from
  # the last - so buying here is buying a pack from roughly two zones
  # ahead of where the window starts, which is the merchant's whole point.
  # Each also carries the merchant-only pets (Stray Cat, Cosmic Leviathan,
  # Eternal Sovereign, ...) that exist in no zone, parked on the rung whose
  # damage window their own damage actually fits.
  #
  # These used to be ten copies of ONE pool - the same twelve pets at the
  # same weights from the 25-coin Starter Pack to the 20-billion Titan
  # Pack, which meant a Titan Pack was a 24% chance of a 3-damage Stray Cat
  # and cost about 10,000x more per point of damage than the zone pack a
  # player could buy at the same moment.
  #
  # Price is 1.5x the middle zone's own pack (starter excepted - it is the
  # on-ramp). That lands the merchant at roughly 0.9-1.25x the zone pack's
  # value per coin measured the way it is actually spent, on the best pet
  # out of a run of opens rather than the average one, which is the right
  # place for a channel that sells you pets you cannot reach yet and is
  # rate-limited by stock besides.
  starter_pack:
    display-name: "&fStarter Egg"
    material: DRAGON_EGG
    coin-cost: 2500
    diamond-cost: 0
    sort: 0
    shop-weight: 100
    shop-luck-exponent: 0.0
