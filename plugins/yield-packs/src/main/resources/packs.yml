# Example starter content for yield-packs - fully data-driven, edit freely.
# Run /admin packs reload after editing to apply changes without restarting
# the server.
#
# Pets can render as a HeadDatabase player head instead of a plain material:
# set "head-database-id" to the id of a head from your HeadDatabase catalog
# (requires the HeadDatabase plugin installed - it's a softdepend). Leave it
# out (or the HeadDatabase plugin absent) and "material" is used instead.
#
# Pets fight ore cubes (see yield-zones) rather than earning idle income:
# "damage" is HP taken off per hit. Every pet attacks on the same shared
# cadence regardless of rarity - damage is the only thing that varies.
#
# The shop is a rotating, per-player stock (see ShopStockService): every
# player's rotation flips over at the same wall-clock moment. Every pack
# always has a slot - "shop-weight" (treated as a percent-out-of-100 chance,
# boosted further by shop-luck-exponent scaling with the player's current
# luck) is independently rolled per pack to decide whether THIS cycle
# restocked it at all, not whether it's shown; a miss just means 0 stock
# (rendered as a barrier) rather than the pack disappearing. On a hit, its
# actual count is a random value between min-stock and max-stock.

shop:
  reset-interval-minutes: 5

# How long (in seconds) a player must wait between opening one pack and the
# next, manual or auto-open alike.
open-cooldown-seconds: 1.0

# Pity: every "rolls"-th pack a player opens, the very next open gets
# "multiplier" luck, then falls back to normal. Add more tiers freely - if
# a roll count matches several at once, the highest multiplier wins.
pity:
  - rolls: 10
    multiplier: 2.0
  - rolls: 100
    multiplier: 3.0

rarities:
  # display-name uses a MiniMessage gradient (two close shades of the
  # rarity's own hue, for a subtle sheen) instead of a flat legacy color
  # code - legendary/mythic/exclusive are deliberately NOT bold. "color" is
  # a separate flat hex, still used everywhere else a single accent color
  # is needed (Bag icon ticks, etc.) - it's the gradient's own first stop.
  common:
    display-name: "<gradient:#AAAAAA:#CCCCCC>Common</gradient>"
    color: "#AAAAAA"
    sort: 0
    luck-exponent: 0.0
  uncommon:
    display-name: "<gradient:#55FF55:#33CC66>Uncommon</gradient>"
    color: "#55FF55"
    sort: 1
    luck-exponent: 0.25
  rare:
    display-name: "<gradient:#5599FF:#3366FF>Rare</gradient>"
    color: "#5599FF"
    sort: 2
    luck-exponent: 0.5
  epic:
    display-name: "<gradient:#AA55FF:#7733CC>Epic</gradient>"
    color: "#AA55FF"
    sort: 3
    luck-exponent: 0.75
  legendary:
    display-name: "<gradient:#FFAA00:#FFD700>Legendary</gradient>"
    color: "#FFAA00"
    sort: 4
    luck-exponent: 1.0
  mythic:
    display-name: "<gradient:#FF55FF:#FF77CC>Mythic</gradient>"
    color: "#FF55FF"
    sort: 5
    luck-exponent: 1.5
  exclusive:
    display-name: "<gradient:#00E5FF:#66FFEE>Exclusive</gradient>"
    color: "#00E5FF"
    sort: 6
    luck-exponent: 2.0
  # The new top-of-the-food-chain tier - unlike exclusive (special-means-only,
  # never in a normal pack's pool), a secret pet sits at the very bottom of
  # every pack's own pool at a vanishingly small weight, so ANY pack, even
  # the cheapest starter one, has a real (if astronomically tiny) shot at it.
  # sort: 7 clears PackRevealAnimationService#tierFor's ">= 5" JACKPOT
  # threshold, so pulling one always gets the biggest reel flourish.
  secret:
    display-name: "<gradient:#FF3B3B:#FFA500:#FFEE00:#4CFF4C:#33CFFF:#B15CFF:#FF4CE1>Secret</gradient>"
    color: "#FF4CE1"
    sort: 7
    luck-exponent: 2.5

