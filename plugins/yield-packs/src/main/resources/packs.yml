# Example starter content for yield-packs - fully data-driven, edit freely.
# Run /admin packs reload after editing to apply changes without restarting
# the server.
#
# Pets can render as a HeadDatabase player head instead of a plain material:
# set "head-database-id" to the id of a head from your HeadDatabase catalog
# (requires the HeadDatabase plugin installed - it's a softdepend). Leave it
# out (or the HeadDatabase plugin absent) and "material" is used instead.
#
# Pets fight ore cubes (see yield-zones) rather than earning idle income:
# "damage" is HP taken off per hit. Every pet attacks on the same shared
# cadence regardless of rarity - damage is the only thing that varies.
#
# The shop is a rotating, per-player stock (see ShopStockService): every
# player's rotation flips over at the same wall-clock moment. Every pack
# always has a slot - "shop-weight" (treated as a percent-out-of-100 chance,
# boosted further by shop-luck-exponent scaling with the player's current
# luck) is independently rolled per pack to decide whether THIS cycle
# restocked it at all, not whether it's shown; a miss just means 0 stock
# (rendered as a barrier) rather than the pack disappearing. On a hit, its
# actual count is a random value between min-stock and max-stock.

shop:
  reset-interval-minutes: 5

# How long (in seconds) a player must wait between opening one pack and the
# next, manual or auto-open alike.
open-cooldown-seconds: 1.0

# What an egg LOOKS like in the world - on its station, and in the clutch
# that hatches in front of a player. Blank means "use the pack's own
# material", which is what every egg does today: a real Dragon Egg. Set a
# HeadDatabase id here (or per-pack with "head-database-id") if you'd
# rather they were custom heads; a pack falls back to its material anyway
# when HeadDatabase isn't installed or the id doesn't resolve.
egg-head-database-id: ""

# ---------------------------------------------------------------------------
# HUGE PETS - the chase.
#
# A Huge is not an entry in any pack's pool. It REPLACES whatever you rolled,
# at "chance" per roll (multiplied by your luck), with a Huge version of that
# same pet - so a Huge always comes from the pack you were actually opening.
# If the pet you rolled has no Huge version (its rarity isn't listed below),
# one of that pack's own eligible pets is picked instead, so a lucky roll is
# never wasted.
#
# One Huge is synthesized per eligible pet automatically - there is nothing to
# write here per pet. A Huge's damage is NOT its own stat: it is your best
# normal pet's damage times (1 + the percent below), which is what makes a
# Huge pulled in Meadow still worth equipping in Genesis Core, and what makes
# them the thing worth trading for.
#
# "chance" is the odds of getting SOME Huge. Which one it turns out to be is
# then drawn from this pack's own weights, restricted to eligible pets - so
# the rarity ladder survives inside the chase. In Meadow that works out to
# roughly 1 in 5,900 for a Huge of one of its Rares and 1 in 4.4 MILLION for
# a Huge of its Secret.
#
# 1 in 2,500 is set against how many packs the balance model says a player
# actually opens: about 3,000 across one full pass down the zone ladder (see
# BALANCE.md), so roughly one Huge per pass, arriving somewhere around the
# middle zones. Rare enough that chat lighting up means something, common
# enough to be a chase with an end. Luck multiplies it.
huge:
  chance: 0.0004
  # Rarity -> how much stronger that Huge is than your best normal pet.
  # A rarity left out of this list simply has no Huge version at all, which
  # is why commons and uncommons are absent: a Huge Field Mouse would be the
  # single best pet in the game and cost nothing to chase.
  damage-percent:
    rare: 0.50
    epic: 0.75
    legendary: 1.00
    mythic: 1.50
    exclusive: 2.00
    secret: 3.00

# SHINY - the other half of the chase, and deliberately the opposite shape.
#
# Shiny is a flat roll on every pet you obtain, stacking with everything:
# rarity, fusion tier, and Huge. A Shiny Golden Huge Star Dragon is a real
# thing you can own. It is a flag on the owned pet rather than its own
# definition (see VariantConfig), so it costs nothing in the registry.
#
# Deliberately NOT luck-scaled. Luck is already the lever for rarity; leaving
# one roll untouched by it means there is always a surprise that a maxed-out
# account hasn't optimised away.
# 1 in 120 against ~3,000 packs a pass is about 25 Shinies per pass - often
# enough to be a real, recurring little hit, rare enough that it never stops
# registering. At the 1-in-40 this started at you would see 75 a pass and
# stop noticing them entirely.
shiny:
  chance: 0.00833
  damage-multiplier: 1.25


# Pity: every "rolls"-th pack a player opens, the very next open gets
# "multiplier" luck, then falls back to normal. Add more tiers freely - if
# a roll count matches several at once, the highest multiplier wins.
pity:
  - rolls: 10
    multiplier: 2.0
  - rolls: 100
    multiplier: 3.0

rarities:
  # display-name uses a MiniMessage gradient (two close shades of the
  # rarity's own hue, for a subtle sheen) instead of a flat legacy color
  # code - legendary/mythic/exclusive are deliberately NOT bold. "color" is
  # a separate flat hex, still used everywhere else a single accent color
  # is needed (Bag icon ticks, etc.) - it's the gradient's own first stop.
  common:
    display-name: "<gradient:#AAAAAA:#CCCCCC>Common</gradient>"
    color: "#AAAAAA"
    sort: 0
    luck-exponent: 0.0
  uncommon:
    display-name: "<gradient:#55FF55:#33CC66>Uncommon</gradient>"
    color: "#55FF55"
    sort: 1
    luck-exponent: 0.25
  rare:
    display-name: "<gradient:#5599FF:#3366FF>Rare</gradient>"
    color: "#5599FF"
    sort: 2
    luck-exponent: 0.5
  epic:
    display-name: "<gradient:#AA55FF:#7733CC>Epic</gradient>"
    color: "#AA55FF"
    sort: 3
    luck-exponent: 0.75
  legendary:
    display-name: "<gradient:#FFAA00:#FFD700>Legendary</gradient>"
    color: "#FFAA00"
    sort: 4
    luck-exponent: 1.0
  mythic:
    display-name: "<gradient:#FF55FF:#FF77CC>Mythic</gradient>"
    color: "#FF55FF"
    sort: 5
    luck-exponent: 1.5
  exclusive:
    display-name: "<gradient:#00E5FF:#66FFEE>Exclusive</gradient>"
    color: "#00E5FF"
    sort: 6
    luck-exponent: 2.0
  # The new top-of-the-food-chain tier - unlike exclusive (special-means-only,
  # never in a normal pack's pool), a secret pet sits at the very bottom of
  # every pack's own pool at a vanishingly small weight, so ANY pack, even
  # the cheapest starter one, has a real (if astronomically tiny) shot at it.
  # sort: 7 clears PackRevealAnimationService#tierFor's ">= 5" JACKPOT
  # threshold, so pulling one always gets the biggest reel flourish.
  secret:
    display-name: "<gradient:#FF3B3B:#FFA500:#FFEE00:#4CFF4C:#33CFFF:#B15CFF:#FF4CE1>Secret</gradient>"
    color: "#FF4CE1"
    sort: 7
    luck-exponent: 2.5

