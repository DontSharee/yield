  # --- The black market (see yield-packstations' pack-stations.yml) ---
  # One egg, five Exclusive pets, bought with STORE CREDITS rather than with
  # anything earned in a zone - the only thing in the game priced that way.
  #
  # It replaced three "elite cache" eggs that sold ordinary zone pets at a
  # markup on an hourly rotation. Those were a worse version of the zone
  # station next to them: same pets, more money, and a timer telling you to
  # come back later. A shop that sells what you cannot get anywhere else is
  # a reason to look; a shop that sells the same thing slower is not.
  #
  # Credits come from the Store (real money, 100 per dollar - see
  # yield-achievements' DonationGoalStore) and in small amounts from
  # achievements and milestones, so a free player can reach one of these
  # eventually and a paying one can have it today. 2,000 credits is $20 a
  # hatch; it is the single number to turn if that is the wrong price.
  black_market_egg:
    display-name: "&8&lBlack Market Egg"
    material: DRAGON_EGG
    coin-cost: 0
    diamond-cost: 0
    credit-cost: 2000
    sort: 200
    shop-weight: 0
    shop-luck-exponent: 0.0
    min-stock: 1
    max-stock: 1
    pool:
      - { item: black_obsidian_warden, weight: 30 }
      - { item: black_astral_leviathan, weight: 25 }
      - { item: black_eclipse_tyrant, weight: 20 }
      - { item: black_genesis_sovereign, weight: 15 }
      - { item: black_infinity_wyrm, weight: 10 }

