# The Enchant Market - /enchantmarket, or the button on /enchants.
#
# Every player gets their OWN set of offers, but everyone's restocks at the
# same moment: the top of every real hour (server clock). Nothing is stored
# to make that happen - a player's offers are generated from their UUID and
# the hour, so they are the same every time they open the screen, different
# from everyone else's, and brand new at :00. Only which offers they have
# already bought is saved.
#
# Each offer can be bought once per restock.
#
# Books are otherwise rare: they drop from roughly one cube in 2,500 (see
# yield-zones' zones.yml, "enchant-book-chance"). This is the steady,
# choosable source - you can't pick what drops, but you can pick what you
# buy here.
offers: 6

# Per-offer rarity weights. Legendary at 6 of 171 is ~3.5% an offer, so an
# hour's six offers hold at least one Legendary about 19% of the time -
# roughly once every five hours - and about one offer in nine is Epic.
# Everyone online whose market rolled a Legendary gets told at the restock.
# Mythic and above never appear here: those stay drop-only, the thing the
# market cannot sell you.
#
# Tuned WITH the found-book table (yield-packs' EnchantService) and the boss
# block's Epic floor so a full run at luck 1 comes out at ~18 Epics, ~6
# Legendaries and ~1 Mythic - the enchant power books gave when they fell
# from eggs, from ~100 books instead of ~775. The first cut of this file
# (100/55/25/9/5) gave ~4 Epics and ~2 Legendaries: rare, but a real loss
# of power nobody had asked for.
rarity-weights:
  common: 60
  uncommon: 50
  rare: 35
  epic: 20
  legendary: 6

# Price of one book, in BASIC CUBES of the richest ladder zone the player
# has unlocked - i.e. price = that zone's tier-1 coin value x this number.
# So it keeps pace with the ladder: a Legendary in the Meadow and one in
# the Genesis Core are both "about 6,000 basic cubes' worth".
#
# Not priced in eggs, deliberately: an hour of income buys ~1,800 eggs
# early on and ~21 late (egg prices outgrow income), so a price in eggs
# would make books ~80x cheaper at the start than at the end.
#
# A steady player breaks about one cube a second, and with the zone's
# richer tiers and their own multipliers earns well over a basic cube's
# worth each - so a Legendary is under an hour of play, less the stronger
# the player's coin multipliers are.
price-in-basic-cubes:
  common: 100
  uncommon: 250
  rare: 700
  epic: 2000
  legendary: 6000
