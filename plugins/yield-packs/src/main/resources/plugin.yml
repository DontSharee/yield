name: yield-packs
version: '${version}'
main: me.dontshare.yieldpacks.YieldPacks
api-version: '26.2'
depend: [yield-core]
softdepend: [PlaceholderAPI, HeadDatabase]
permissions:
  yieldpacks.admin:
    default: op
  yieldpacks.autofuse:
    default: op
  yieldpacks.autotap:
    default: false
  # Infinite Storage pass - no pet storage limit (BagStorageService).
  yieldpacks.storage.infinite:
    default: false
  # The old Free Auto Send pass - still honoured, as Auto Tap (CombatPerks).
  yieldpacks.automode:
    default: false
  yieldpacks.automode.premium:
    default: false
