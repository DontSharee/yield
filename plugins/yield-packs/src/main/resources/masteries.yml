      - { id: enchant_slot_1, display-name: "Enchant Slot I", level: 20, stat: enchant_bonus_slots, value: 1,
          description: ["+1 player Enchant Book slot."] }
      - { id: diamond_boost_2, display-name: "Diamond Boost II", level: 35, stat: diamond_multiplier, value: 0.05,
          description: ["+5% more diamonds from everything."] }
      - { id: refinery_luck_1, display-name: "Luck I", level: 50, stat: luck, value: 0.03,
          description: ["+3% luck."] }
      - { id: enchant_slot_2, display-name: "Enchant Slot II", level: 65, stat: enchant_bonus_slots, value: 1,
          description: ["+1 more player Enchant Book slot."] }
      - { id: diamond_boost_3, display-name: "Diamond Boost III", level: 80, stat: diamond_multiplier, value: 0.10,
          description: ["+10% more diamonds from everything."] }
      - { id: refinery_luck_2, display-name: "Luck II", level: 99, stat: luck, value: 0.05,
          description: ["+5% more luck."] }
      - { id: enchant_slot_3, display-name: "Enchant Slot III", level: 99, stat: enchant_bonus_slots, value: 1,
          description: ["+1 more player Enchant Book slot."] }
