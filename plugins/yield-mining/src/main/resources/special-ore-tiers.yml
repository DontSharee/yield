# Special Ore rarity tiers - every mined block independently rolls, rarest
# first, for a chance to come back as a "Special Ore" instead of a plain
# one (see MiningService#rollSpecialOre). one-in is that tier's odds (10 =
# 1 in 10); multiplier-min/max is the range its Multiplier stat rolls
# within - these get combined at /forge to make a held item. Run
# /admin mining reload after editing.
tiers:
  common:
    display-name: "<gray>Common</gray>"
    one-in: 10
    multiplier-min: 0.001
    multiplier-max: 0.003
  uncommon:
    display-name: "<green>Uncommon</green>"
    one-in: 50
    multiplier-min: 0.003
    multiplier-max: 0.008
  rare:
    display-name: "<aqua>Rare</aqua>"
    one-in: 250
    multiplier-min: 0.008
    multiplier-max: 0.02
  epic:
    display-name: "<light_purple>Epic</light_purple>"
    one-in: 2000
    multiplier-min: 0.02
    multiplier-max: 0.06
  legendary:
    display-name: "<gold>Legendary</gold>"
    one-in: 20000
    multiplier-min: 0.06
    multiplier-max: 0.15
  mythic:
    display-name: "<red>Mythic</red>"
    one-in: 700000
    multiplier-min: 0.15
    multiplier-max: 1.25
