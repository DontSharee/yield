# The guide NPC that walks a brand-new player through hatching an egg,
# equipping a pet, entering a zone, and sending that pet at a cube. Run
# /tutorialadmin reload after editing this file - a player already mid-step
# just sees the new dialogue/reward the next time their current step is
# (re)shown, nothing resets.
#
# "world" must match a currently-loaded world's name exactly, and the
# coordinates below are an arbitrary near-spawn placeholder - move the NPC
# by editing x/y/z/yaw here, there's no in-game placement command for it yet.
npc:
  name: "Guide"
  world: spawn
  x: 0.5
  y: 65.0
  z: 0.5
  yaw: 0.0

# Each step's own "label" (the short line shown on the sidebar checklist),
# list of chat lines, and which in-game action (CompletionTrigger: OPEN_PACK,
# EQUIP_PET, ENTER_ZONE, KILL_CUBE) advances it. "goal" (default 1) lets a
# step require more than one occurrence before it's checked off - the
# checklist shows live "X/goal" progress toward whichever one is current.
# reward-coins/reward-diamonds are optional (default 0) and paid the moment that
# step completes, on top of whatever the action itself already earned.
steps:
  - id: welcome
    label: "Hatch an egg"
    dialogue:
      - "Welcome to Yield!"
      - "Let's get you started - find the floating egg at the zone entrance."
      - "Smack it to hatch one, or right-click to see what's inside first."
    completes-on: OPEN_PACK
    goal: 1
  - id: equip
    label: "Equip a pet"
    dialogue:
      - "Nice pull! Now equip that pet from your Bag (/bag)."
      - "Sneak-smack the egg to hatch a whole batch at once."
    completes-on: EQUIP_PET
    goal: 1
  - id: enter_zone
    label: "Enter a zone"
    dialogue:
      - "Head into a zone - that's where the action is."
    completes-on: ENTER_ZONE
    goal: 1
    reward-coins: 500
  - id: send_pet
    label: "Kill 3 cubes"
    dialogue:
      - "See that falling cube? Left-click it, then send your pet at it - pets don't fight on their own until you tell them to."
    completes-on: KILL_CUBE
    goal: 3
    reward-coins: 1000
    reward-diamonds: 1
