# Daily quests reset at local midnight (the server's system default
# timezone). Run /admin quests reload after editing this file.
#
# Quests are organized into named CATEGORIES (add as many as you want -
# purely config-driven, no code changes needed). Each category offers
# exactly 3 tiers - easy/medium/hard - and a player commits to ONE of them
# per category per day (see /quests): pick a tier, and it's locked in until
# the next reset. Miss the goal by then and you get nothing for that
# category that day; hit it and claim the reward.
#
# Rewards: "reward-coins"/"reward-diamonds" are the baseline. Two more are
# optional, both default to none:
#   reward-credits - a bonus of the auction house's own credits currency
#   reward-pet     - grants ONE guaranteed level-1 instance of this item id,
#                     straight into the Bag (doesn't count toward that pet's
#                     pack collection progress - see QuestService#claim)
#
# Each tier's "action" is what counts toward its "goal" - the full list of
# trackable actions:
#   OPEN_PACK      - a pack opened (any pack)
#   OBTAIN_PET     - a pet obtained from an opened pack
#   EQUIP_PET      - a pet equipped
#   UNEQUIP_PET    - a pet unequipped
#   FUSE_PET       - a pet fused into the next tier
#   FEED_CANDY     - a candy fed to a pet
#   LEVEL_UP_PET   - a pet gaining a level (counts each level gained, not each kill)
#   KILL_CUBE      - an ore cube killed in a zone
#   EARN_COINS     - coins earned from ore cube kills
#   ENTER_ZONE     - walking into a zone
#   UNLOCK_ZONE    - purchasing a locked zone's unlock
#   REBIRTH        - a rebirth taken
#   PRESTIGE       - a prestige taken
#   BUY_SKILL_NODE - a skill tree node leveled up (manual buy or auto-buy)
