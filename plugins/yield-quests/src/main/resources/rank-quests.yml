# Rank Quest pool - a player always has 3 of these active at once (see
# RankQuestService), picked at random. Completing one grants its
# reward-stars immediately; once all 3 active quests are done, a fresh 3
# get rolled from this same pool. Stars accumulate toward Rank (/rankup).
#
# Every value here is a placeholder judgment call - retune freely, no code
# changes needed (/quests reload picks this back up).
pool:
  open_packs_small:
    display-name: "Open 5 Packs"
    icon: CHEST
    action: OPEN_PACK
    goal: 5
    reward-stars: 2
