# /daily is a per-SESSION reward chain, not a calendar streak - 10
# presents, each unlocking once you've been online THIS session for at
# least "unlock-after-minutes". Once unlocked, a present stays claimable
# any time (no rush, no order requirement) for as long as you stay
# connected - but logging out re-locks everything: nothing here is saved
# across a relog, by design, to reward longer sessions rather than just
# logging in and out.
#
# "head" is a HeadDatabase texture id (find one in-game via /hdb, or from
# https://minecraft-heads.com - the URL's own numeric id works) - leave it
# blank to use "fallback-material" instead (also used automatically if
# HeadDatabase isn't installed).
#
# Run /admin quests reload after editing this file - already-online players
# keep their current session progress either way, only the reward numbers/
# thresholds themselves change.
# BALANCE - one present every five minutes for the first hour of a
# session, like Pet Simulator's free gifts: frequent enough that there's
# nearly always one on the way, each a little bigger than the last. The
# first is a welcome for a brand-new player; the twelfth is worth about a
# minute of late-game income. Nothing here is ever the fastest way to earn.
#
# When a present unlocks it drops out of the sky next to the player as a
# real (client-side) present they smack open - it bursts and sprays its
# coins/diamonds as collectable loot. /daily still lists them all.
presents:
  - { unlock-after-minutes: 5, head: "", fallback-material: WHITE_SHULKER_BOX, coins: 500000, diamonds: 50 }
  - { unlock-after-minutes: 10, head: "", fallback-material: ORANGE_SHULKER_BOX, coins: 1000000, diamonds: 75 }
  - { unlock-after-minutes: 15, head: "", fallback-material: MAGENTA_SHULKER_BOX, coins: 1500000, diamonds: 120 }
  - { unlock-after-minutes: 20, head: "", fallback-material: LIGHT_BLUE_SHULKER_BOX, coins: 2500000, diamonds: 150 }
  - { unlock-after-minutes: 25, head: "", fallback-material: YELLOW_SHULKER_BOX, coins: 4000000, diamonds: 250 }
  - { unlock-after-minutes: 30, head: "", fallback-material: LIME_SHULKER_BOX, coins: 7500000, diamonds: 400 }
  - { unlock-after-minutes: 35, head: "", fallback-material: PINK_SHULKER_BOX, coins: 12000000, diamonds: 500 }
  - { unlock-after-minutes: 40, head: "", fallback-material: CYAN_SHULKER_BOX, coins: 20000000, diamonds: 750 }
  - { unlock-after-minutes: 45, head: "", fallback-material: PURPLE_SHULKER_BOX, coins: 40000000, diamonds: 1000 }
