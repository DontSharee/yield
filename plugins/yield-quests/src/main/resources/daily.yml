# /daily is a per-SESSION reward chain, not a calendar streak - 10
# presents, each unlocking once you've been online THIS session for at
# least "unlock-after-minutes". Once unlocked, a present stays claimable
# any time (no rush, no order requirement) for as long as you stay
# connected - but logging out re-locks everything: nothing here is saved
# across a relog, by design, to reward longer sessions rather than just
# logging in and out.
#
# "head" is a HeadDatabase texture id (find one in-game via /hdb, or from
# https://minecraft-heads.com - the URL's own numeric id works) - leave it
# blank to use "fallback-material" instead (also used automatically if
# HeadDatabase isn't installed).
#
# Run /admin quests reload after editing this file - already-online players
# keep their current session progress either way, only the reward numbers/
# thresholds themselves change.
# BALANCE - the chain is a reward for STAYING ONLINE, so it is paced against
# the session it is meant to encourage: present 1 lands in the first five
# minutes (when a new player has almost nothing), and the last one at 4.5
# hours is worth about a minute of late-game income. Nothing here is ever
# the fastest way to earn - it is a thank-you for a long session.
presents:
  - { unlock-after-minutes: 5, head: "", fallback-material: WHITE_SHULKER_BOX, coins: 500000, diamonds: 50 }
  - { unlock-after-minutes: 10, head: "", fallback-material: ORANGE_SHULKER_BOX, coins: 1200000, diamonds: 100 }
  - { unlock-after-minutes: 25, head: "", fallback-material: MAGENTA_SHULKER_BOX, coins: 3000000, diamonds: 200 }
