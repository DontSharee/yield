# /daily - a chain of gifts that unlock with the time you've played TODAY
# (across any number of sessions: relogging doesn't reset the timers) and
# reset at midnight, server time - the same moment daily quests reset.
# Opened gifts stay opened until then.
#
# Each gift has a rarity from gift-rarities below: the name its item shows
# ("Common Gift") and the present head it's drawn as ("head" is the base64
# texture value from minecraft-heads.com). A present's own "head" (a
# HeadDatabase id) and "fallback-material" are only used when its rarity
# has no head texture.
#
# Run /admin quests reload after editing this file.
gift-rarities:
  common:    { name: "Common",    head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjhkYzNjODQ0OTFjNGZmMTAzZGU2ZWEwMTg4MGUyZDgzNDMyY2Q0ODc4Yjg0ZDZiNDMyNTNjYzUxZmQ5NzhlNyJ9fX0=" }
