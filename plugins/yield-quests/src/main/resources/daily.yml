  - { unlock-after-minutes: 100, head: "", fallback-material: LIME_SHULKER_BOX, coins: 30000000, diamonds: 1000, }
  - { unlock-after-minutes: 135, head: "", fallback-material: PINK_SHULKER_BOX, coins: 60000000, diamonds: 1750 }
